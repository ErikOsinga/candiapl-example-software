[project]
name = "candiamazing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ErikOsinga", email = "erikosinga876@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.2.0",
    "numpy>=2.3.5",
]

[project.scripts]
candiamazing = "candiamazing:main"
calcrm = "candiamazing.cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[tool.ruff]
# Apply to both src and tests by default
src = ["src", "tests"]
# default line length
line-length = 88

[tool.ruff.format]
# use double quotes for strings.
quote-style = "double"
# indent with spaces, rather than tabs.
indent-style = "space"
# respect magic trailing commas.
skip-magic-trailing-comma = false

[tool.ruff.lint]
# Can expand this as far as user wants
select = [
  "E",   # pycodestyle (PEP8) errors
  "F",   # pyflakes
  "I",   # isort-like import sorting
  "B",   # bugbear (common bugs)
  "UP",  # pyupgrade (modern Python idioms)
  "D",   # pydocstyle: docstring rules
]
ignore = [
  "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.mypy]
packages = ["candiamazing"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",   # detailed report at the end, including all except passed tests
  "--cov=src", # check coverage of code in src/ directory
  "--cov-report=term-missing", # prints uncovered lines at the end
]